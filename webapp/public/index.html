<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Measur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f5f1;
    --ink: #1c2321;
    --blue: #2b50e0;
    --green: #109a54;
    --graphite: #5c5d55;
    --line: #d8d6cd;
    --error: #c63a2f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { height: 100%; }
  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ---------- header with millimetre rule ---------- */
  header { padding: 28px 32px 0; }
  .masthead { display: flex; align-items: baseline; gap: 14px; }
  h1 {
    font-family: 'IBM Plex Sans Condensed', sans-serif;
    font-weight: 600;
    font-size: 1.55rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .title-stack { display: flex; flex-direction: column; gap: 2px; }
  .masthead .subtitle {
    font-style: italic;
    font-size: 0.85rem;
    color: var(--graphite);
  }
  .masthead .unit {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--graphite);
    margin-left: auto;
  }
  /* mm graduations: fine tick every 4px, tall tick every 40px */
  .rule {
    margin-top: 14px;
    height: 14px;
    border-bottom: 2px solid var(--ink);
    background:
      repeating-linear-gradient(to right, var(--ink) 0 1px, transparent 1px 40px) bottom / 100% 14px no-repeat,
      repeating-linear-gradient(to right, var(--ink) 0 1px, transparent 1px 8px) bottom / 100% 7px no-repeat;
  }

  main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 28px;
    padding: 24px 32px;
    align-items: stretch;
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
  }
  .viewer { display: flex; min-height: 0; }
  aside.titleblock { align-self: start; max-height: 100%; overflow-y: auto; }
  @media (max-width: 900px) {
    body { height: auto; min-height: 100dvh; overflow: auto; }
    main { grid-template-columns: 1fr; }
    .window, .pick { min-height: 300px; }
  }

  /* ---------- viewer: styled as the physical frame ---------- */
  .frame {
    background: #111;
    border-radius: 6px;
    padding: 26px;               /* the black border of the printed frame */
    transition: box-shadow 0.15s ease;
    flex: 1;
    display: flex;
    min-height: 0;
    position: relative;
  }
  .frame.dragover { box-shadow: 0 0 0 3px var(--blue); }

  .pick {
    flex: 1;
    border: 0;
    font: inherit;
    background: #fff;
    border-radius: 3px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .pick:focus-visible { outline: 3px solid var(--blue); outline-offset: -6px; }
  .placeholder { display: block; text-align: center; padding: 40px 24px; }
  .placeholder .cross {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--blue);
    font-size: 1.6rem;
    display: block;
    margin-bottom: 14px;
  }
  .placeholder .line {
    display: block;
    color: var(--graphite); font-size: 0.95rem; max-width: 34ch; margin: 0 auto;
  }
  .placeholder .line strong { color: var(--ink); font-weight: 500; }
  .placeholder .hint {
    margin-top: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
  }

  .window {
    background: #fff;
    border-radius: 3px;
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: hidden;
  }
  .window svg.editor {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* editor overlay */
  .editor { cursor: crosshair; }
  .editor.panning { cursor: grabbing; }
  .editor .outline {
    fill: none; stroke: var(--green); stroke-width: 3; vector-effect: non-scaling-stroke;
  }
  .editor .hitpath {
    fill: none; stroke: transparent; stroke-width: 14; cursor: copy;
    vector-effect: non-scaling-stroke;
  }
  .editor .obox {
    fill: none; stroke: var(--blue); stroke-width: 1.5;
    stroke-dasharray: 6 6; vector-effect: non-scaling-stroke;
  }
  .editor .node {
    fill: #fff; stroke: var(--green); stroke-width: 2.5;
    cursor: grab; vector-effect: non-scaling-stroke;
  }
  .editor .node:hover { fill: var(--green); }
  .editor .node.dragging { cursor: grabbing; fill: var(--green); }

  .busy {
    position: absolute; inset: 26px;
    border-radius: 3px;
    background: rgba(255,255,255,0.88);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; color: var(--graphite);
  }
  .busy .scanline {
    width: 60%; height: 2px; background: var(--blue); position: relative; overflow: visible;
    animation: scan 1.6s ease-in-out infinite alternate;
  }
  @keyframes scan { from { transform: translateY(-60px); } to { transform: translateY(60px); } }
  @media (prefers-reduced-motion: reduce) { .busy .scanline { animation: none; } }

  /* ---------- title block (engineering drawing style) ---------- */
  .titleblock {
    border: 2px solid var(--ink);
    background: #fff;
  }
  .tb-head {
    padding: 10px 14px;
    border-bottom: 2px solid var(--ink);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .tb-head h2 {
    font-family: 'IBM Plex Sans Condensed', sans-serif;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-size: 0.8rem;
  }
  .tb-head .file {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem; font-weight: 400;
    color: var(--graphite); text-transform: none; letter-spacing: 0;
    max-width: 15ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tb-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
  }
  .tb-row:last-of-type { border-bottom: none; }
  .tb-row .label {
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--graphite);
  }
  .tb-row .value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.05rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .tb-row .value small { font-weight: 400; color: var(--graphite); font-size: 0.75rem; }
  .tb-row.dim .value { color: var(--blue); font-size: 1.35rem; }
  .tb-empty { padding: 22px 14px; color: var(--graphite); font-size: 0.85rem; }

  .tb-edit {
    padding: 10px 14px; border-top: 1px solid var(--line);
    font-size: 0.75rem; color: var(--graphite); line-height: 1.5;
    display: flex; flex-direction: column; gap: 8px;
  }
  .tb-edit .actions { display: flex; gap: 8px; }
  .tb-edit button {
    font: inherit; font-size: 0.75rem;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    padding: 5px 10px; border-radius: 3px; cursor: pointer;
  }
  .tb-edit button:hover { border-color: var(--ink); }
  .tb-edit button:focus-visible { outline: 2px solid var(--blue); }

  .tb-downloads { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); }
  .tb-downloads a {
    flex: 1; text-align: center; text-decoration: none;
    font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 600;
    letter-spacing: 0.08em; font-size: 0.75rem; text-transform: uppercase;
    color: #fff; background: var(--blue); padding: 9px 0; border-radius: 3px;
    cursor: pointer;
  }
  .tb-downloads a:hover { background: #1e3cb0; }
  .tb-downloads a:focus-visible { outline: 2px solid var(--ink); }
  .tb-error {
    padding: 14px; font-size: 0.85rem; color: var(--error);
    border-top: 2px solid var(--error); background: #fdf3f2;
  }

  /* ---------- options ---------- */
  .options { margin-top: 20px; border-top: 1px solid var(--line); padding: 16px 14px; }
  .opt-full { grid-column: 1 / -1; }
  .options summary {
    font-family: 'IBM Plex Sans Condensed', sans-serif;
    font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    font-size: 0.75rem; color: var(--graphite); cursor: pointer; list-style: none;
  }
  .options summary::after { content: ' +'; }
  .options[open] summary::after { content: ' \2212'; }
  .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .opt { display: flex; flex-direction: column; gap: 4px; }
  .opt label { font-size: 0.75rem; color: var(--graphite); }
  .opt input[type=number] {
    font-family: 'IBM Plex Mono', monospace;
    padding: 7px 9px; border: 1px solid var(--line); border-radius: 3px;
    background: #fff; font-size: 0.9rem; width: 100%;
  }
  .opt input[type=number]:focus-visible { outline: 2px solid var(--blue); }
  .opt input[type=range] { accent-color: var(--blue); width: 100%; }
  .opt .range-label { display: flex; justify-content: space-between; }
  .opt .range-label output { font-family: 'IBM Plex Mono', monospace; color: var(--ink); }
  .opt-check { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; }
  .opt-check label { font-size: 0.85rem; color: var(--ink); }
  .opt-check input { accent-color: var(--blue); width: 16px; height: 16px; }

  footer {
    padding: 14px 32px;
    border-top: 1px solid var(--line);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--graphite);
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  input[type=file] { display: none; }
</style>
</head>
<body>

<header>
  <div class="masthead">
    <div class="title-stack">
      <h1>Measur</h1>
      <span class="subtitle">working title</span>
    </div>
    <span class="unit">mm</span>
  </div>
  <div class="rule" aria-hidden="true"></div>
</header>

<main>
  <div class="viewer">
    <div class="frame" id="dropframe">
      <button type="button" class="pick" id="pick"
              aria-label="Choose or drop a photo to measure">
        <span class="placeholder">
          <span class="cross">+</span>
          <span class="line"><strong>Drop a photo here</strong> or click to choose one.</span>
          <span class="line hint">object inside the black frame &middot; jpg / png</span>
        </span>
      </button>
      <span class="window" id="window" hidden>
        <svg class="editor" id="editor" preserveAspectRatio="xMidYMid meet"
             role="img" aria-label="Calibrated top-down view with editable outline">
          <g id="world">
            <image id="warped-image" x="0" y="0"></image>
            <polygon class="obox" id="obox"></polygon>
            <polygon class="hitpath" id="hitpath"></polygon>
            <polygon class="outline" id="outline"></polygon>
            <g id="nodes"></g>
          </g>
        </svg>
      </span>
      <span class="busy" id="busy" hidden>
        <span class="scanline"></span>
        measuring&hellip;
      </span>
    </div>
    <input type="file" id="file-input" accept="image/*">
  </div>

  <aside class="titleblock">
    <div class="tb-head">
      <h2>Measurements</h2>
      <span class="file" id="tb-file"></span>
    </div>
    <div aria-live="polite">
      <div id="tb-body">
        <div class="tb-empty">Waiting for a photo.</div>
      </div>
      <div class="tb-edit" id="tb-edit" hidden>
        <span>Edit the outline: drag a node &middot; double-click a node to delete
          &middot; click an edge to add one.</span>
        <span class="actions">
          <button type="button" id="btn-reset">Reset outline</button>
          <button type="button" id="btn-new">New photo</button>
        </span>
      </div>
      <div class="tb-downloads" id="tb-downloads" hidden>
        <a id="dl-dxf">DXF for CAD</a>
        <a id="dl-svg">SVG</a>
      </div>
      <div class="tb-error" id="tb-error" hidden></div>
    </div>

    <details class="options">
      <summary>Frame settings</summary>
      <div class="opt-grid">
        <div class="opt">
          <label for="opt-width">Inner width (mm)</label>
          <input type="number" id="opt-width" value="150" step="0.1" min="10">
        </div>
        <div class="opt">
          <label for="opt-height">Inner height (mm)</label>
          <input type="number" id="opt-height" value="150" step="0.1" min="10">
        </div>
        <div class="opt opt-full">
          <div class="range-label">
            <label for="opt-smooth">Outline smoothing</label>
            <output id="smooth-val" for="opt-smooth">5</output>
          </div>
          <input type="range" id="opt-smooth" min="0" max="10" step="1" value="5">
        </div>
        <div class="opt opt-full">
          <div class="range-label">
            <label for="opt-shadow">Shadow cut</label>
            <output id="shadow-val" for="opt-shadow">auto</output>
          </div>
          <input type="range" id="opt-shadow" min="0" max="10" step="1" value="0">
        </div>
        <div class="opt-check">
          <input type="checkbox" id="opt-hull">
          <label for="opt-hull">Convex hull (hollow objects: pliers, scissors)</label>
        </div>
      </div>
    </details>
  </aside>
</main>

<footer>
  <span>frame 170 &times; 170 mm &middot; border 10 mm &middot; repeatability &plusmn;0.5 mm across our test photos</span>
  <span id="scale-note"></span>
</footer>

<script>
  const $ = id => document.getElementById(id);
  const dropframe = $('dropframe'), pick = $('pick'), fileInput = $('file-input');
  const windowEl = $('window'), warpedImage = $('warped-image'), busy = $('busy');
  const editorSvg = $('editor'), outlineEl = $('outline'), hitpathEl = $('hitpath');
  const oboxEl = $('obox'), nodesEl = $('nodes'), worldEl = $('world');
  const tbBody = $('tb-body'), tbError = $('tb-error'), tbFile = $('tb-file');
  const tbEdit = $('tb-edit'), tbDownloads = $('tb-downloads'), scaleNote = $('scale-note');

  // ---------- upload plumbing ----------
  let lastFile = null;

  pick.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) measure(fileInput.files[0]);
  });
  ['dragenter', 'dragover'].forEach(ev => dropframe.addEventListener(ev, e => {
    e.preventDefault(); dropframe.classList.add('dragover');
  }));
  ['dragleave', 'drop'].forEach(ev => dropframe.addEventListener(ev, e => {
    e.preventDefault(); dropframe.classList.remove('dragover');
  }));
  dropframe.addEventListener('drop', e => {
    const f = e.dataTransfer.files[0];
    if (f) measure(f);
  });

  // Sliders: 0-10 steps with modest headroom past the useful range.
  const smoothStrength = n => n === 0 ? 0 : Math.pow(10, (n - 1) / 9);
  const shadowFloor = n => n === 0 ? 0 : Math.round(15 + (n - 1) * 80 / 9);

  const smoothSlider = $('opt-smooth'), smoothVal = $('smooth-val');
  smoothSlider.addEventListener('input', () => {
    smoothVal.textContent = smoothSlider.value === '0' ? 'off' : smoothSlider.value;
  });
  smoothSlider.addEventListener('change', () => { if (lastFile) measure(lastFile); });

  const shadowSlider = $('opt-shadow'), shadowVal = $('shadow-val');
  shadowSlider.addEventListener('input', () => {
    shadowVal.textContent = shadowSlider.value === '0' ? 'auto' : shadowSlider.value;
  });
  shadowSlider.addEventListener('change', () => { if (lastFile) measure(lastFile); });

  // ---------- geometry (all in warped px, 10 px per mm) ----------
  const PX_PER_MM = 10;

  function perimeterPx(pts) {
    let p = 0;
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      p += Math.hypot(b[0] - a[0], b[1] - a[1]);
    }
    return p;
  }
  function areaPx(pts) {
    let s = 0;
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      s += a[0] * b[1] - b[0] * a[1];
    }
    return Math.abs(s) / 2;
  }
  function convexHull(pts) {
    const p = [...pts].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cross = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
    const build = list => {
      const h = [];
      for (const pt of list) {
        while (h.length >= 2 && cross(h[h.length-2], h[h.length-1], pt) <= 0) h.pop();
        h.push(pt);
      }
      h.pop();
      return h;
    };
    return build(p).concat(build(p.slice().reverse()));
  }
  // Rotating calipers: smallest rectangle at any angle
  function minAreaRect(pts) {
    const h = convexHull(pts);
    if (h.length < 3) {
      const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
      const x0 = Math.min(...xs), x1 = Math.max(...xs);
      const y0 = Math.min(...ys), y1 = Math.max(...ys);
      return { w: x1-x0, h: y1-y0, corners: [[x0,y0],[x1,y0],[x1,y1],[x0,y1]] };
    }
    let best = null;
    for (let i = 0; i < h.length; i++) {
      const a = h[i], b = h[(i + 1) % h.length];
      const ang = Math.atan2(b[1]-a[1], b[0]-a[0]);
      const c = Math.cos(-ang), s = Math.sin(-ang);
      let minX = 1/0, maxX = -1/0, minY = 1/0, maxY = -1/0;
      for (const p of h) {
        const x = p[0]*c - p[1]*s, y = p[0]*s + p[1]*c;
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
      const area = (maxX-minX) * (maxY-minY);
      if (!best || area < best.area) best = { area, ang, minX, maxX, minY, maxY };
    }
    const { ang, minX, maxX, minY, maxY } = best;
    const c = Math.cos(ang), s = Math.sin(ang);
    const corners = [[minX,minY],[maxX,minY],[maxX,maxY],[minX,maxY]]
      .map(([x,y]) => [x*c - y*s, x*s + y*c]);
    return { w: maxX-minX, h: maxY-minY, corners };
  }

  // ---------- editor state ----------
  let edit = null;  // { pts, orig, w, h, name }

  function enterEditor(data, fileName) {
    edit = {
      pts: data.contour_px.map(p => [p[0], p[1]]),
      orig: data.contour_px.map(p => [p[0], p[1]]),
      w: data.warped_w,
      h: data.warped_h,
      name: fileName.replace(/\.[^.]+$/, ''),
    };
    warpedImage.setAttribute('href', data.warped_url + '?t=' + Date.now());
    warpedImage.setAttribute('width', edit.w);
    warpedImage.setAttribute('height', edit.h);
    editorSvg.setAttribute('viewBox', `0 0 ${edit.w} ${edit.h}`);
    view = { k: 1, tx: 0, ty: 0 };
    applyView();
    pick.hidden = true;
    windowEl.hidden = false;
    tbEdit.hidden = false;
    tbDownloads.hidden = false;
    render();
  }

  function svgPoint(evt) {
    const pt = new DOMPoint(evt.clientX, evt.clientY);
    return pt.matrixTransform(editorSvg.getScreenCTM().inverse());
  }

  // ---------- pan & zoom ----------
  let view = { k: 1, tx: 0, ty: 0 };

  function applyView() {
    worldEl.setAttribute('transform',
      `translate(${view.tx} ${view.ty}) scale(${view.k})`);
  }
  function worldPoint(evt) {
    const p = svgPoint(evt);
    return { x: (p.x - view.tx) / view.k, y: (p.y - view.ty) / view.k };
  }

  editorSvg.addEventListener('wheel', e => {
    if (!edit) return;
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.2 : 1 / 1.2;
    const k = Math.min(20, Math.max(1, view.k * factor));
    if (k === view.k) return;
    const p = svgPoint(e);
    view.tx = p.x - (p.x - view.tx) * (k / view.k);
    view.ty = p.y - (p.y - view.ty) * (k / view.k);
    view.k = k;
    if (k === 1) { view.tx = 0; view.ty = 0; }
    applyView();
    updateNodeSize();
  }, { passive: false });

  let panning = null;
  editorSvg.addEventListener('pointerdown', e => {
    if (e.button !== 1 || !edit) return;   // middle button pans
    e.preventDefault();
    panning = { x: e.clientX, y: e.clientY, tx: view.tx, ty: view.ty,
                scale: editorSvg.getScreenCTM().a };
    editorSvg.classList.add('panning');
    editorSvg.setPointerCapture(e.pointerId);
  });
  editorSvg.addEventListener('pointermove', e => {
    if (!panning) return;
    view.tx = panning.tx + (e.clientX - panning.x) / panning.scale;
    view.ty = panning.ty + (e.clientY - panning.y) / panning.scale;
    applyView();
  });
  ['pointerup', 'pointercancel'].forEach(ev => editorSvg.addEventListener(ev, () => {
    panning = null;
    editorSvg.classList.remove('panning');
  }));
  // stop middle-click autoscroll
  editorSvg.addEventListener('auxclick', e => { if (e.button === 1) e.preventDefault(); });

  function updateNodeSize() {
    const r = 8 / view.k;
    nodesEl.querySelectorAll('.node').forEach(c => c.setAttribute('r', r));
  }

  function render() {
    const ptsStr = edit.pts.map(p => p.join(',')).join(' ');
    outlineEl.setAttribute('points', ptsStr);
    hitpathEl.setAttribute('points', ptsStr);

    const rect = minAreaRect(edit.pts);
    oboxEl.setAttribute('points', rect.corners.map(p => p.join(',')).join(' '));

    // rebuild nodes
    nodesEl.textContent = '';
    edit.pts.forEach((p, i) => {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('class', 'node');
      c.setAttribute('cx', p[0]);
      c.setAttribute('cy', p[1]);
      c.setAttribute('r', 8 / view.k);
      c.dataset.i = i;
      nodesEl.appendChild(c);
    });

    // measurements
    const lenMm = Math.max(rect.w, rect.h) / PX_PER_MM;
    const widMm = Math.min(rect.w, rect.h) / PX_PER_MM;
    tbBody.innerHTML =
      row('Length', lenMm.toFixed(2), 'mm', 'dim') +
      row('Width', widMm.toFixed(2), 'mm', 'dim') +
      row('Perimeter', (perimeterPx(edit.pts) / PX_PER_MM).toFixed(2), 'mm') +
      row('Area', (areaPx(edit.pts) / (PX_PER_MM * PX_PER_MM)).toFixed(1), 'mm&sup2;');
  }

  // drag to move
  let dragging = null;
  nodesEl.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const t = e.target.closest('.node');
    if (!t) return;
    e.preventDefault();
    e.stopPropagation();
    dragging = t;
    t.classList.add('dragging');
    t.setPointerCapture(e.pointerId);
  });
  nodesEl.addEventListener('pointermove', e => {
    if (!dragging) return;
    const p = worldPoint(e);
    const i = +dragging.dataset.i;
    edit.pts[i] = [
      Math.max(0, Math.min(edit.w, p.x)),
      Math.max(0, Math.min(edit.h, p.y)),
    ];
    render();
    dragging = nodesEl.querySelector(`[data-i="${i}"]`);
    if (dragging) dragging.classList.add('dragging');
  });
  ['pointerup', 'pointercancel'].forEach(ev => nodesEl.addEventListener(ev, () => {
    if (dragging) dragging.classList.remove('dragging');
    dragging = null;
  }));

  // double-click node to delete
  nodesEl.addEventListener('dblclick', e => {
    const t = e.target.closest('.node');
    if (!t) return;
    e.stopPropagation();
    if (edit.pts.length <= 3) return;
    edit.pts.splice(+t.dataset.i, 1);
    render();
  });

  // click an edge to insert a node at that spot
  hitpathEl.addEventListener('click', e => {
    const p = worldPoint(e);
    let bestI = 0, bestD = 1/0, bestPt = null;
    for (let i = 0; i < edit.pts.length; i++) {
      const a = edit.pts[i], b = edit.pts[(i + 1) % edit.pts.length];
      const abx = b[0]-a[0], aby = b[1]-a[1];
      const t = Math.max(0, Math.min(1,
        ((p.x-a[0])*abx + (p.y-a[1])*aby) / (abx*abx + aby*aby || 1)));
      const qx = a[0] + t*abx, qy = a[1] + t*aby;
      const d = Math.hypot(p.x-qx, p.y-qy);
      if (d < bestD) { bestD = d; bestI = i; bestPt = [qx, qy]; }
    }
    edit.pts.splice(bestI + 1, 0, bestPt);
    render();
  });

  $('btn-reset').addEventListener('click', () => {
    edit.pts = edit.orig.map(p => [p[0], p[1]]);
    render();
  });
  $('btn-new').addEventListener('click', () => fileInput.click());

  // ---------- downloads generated from the edited path ----------
  function downloadBlob(text, name, type) {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.click();
    URL.revokeObjectURL(url);
  }
  $('dl-dxf').addEventListener('click', () => {
    if (!edit) return;
    const lines = ['0','SECTION','2','ENTITIES','0','POLYLINE','8','0','66','1','70','1'];
    for (const [x, y] of edit.pts) {
      lines.push('0','VERTEX','8','0',
        '10', (x / PX_PER_MM).toFixed(3),
        '20', ((edit.h - y) / PX_PER_MM).toFixed(3));   // DXF is Y-up
    }
    lines.push('0','SEQEND','0','ENDSEC','0','EOF');
    downloadBlob(lines.join('\n') + '\n', edit.name + '_outline.dxf', 'application/dxf');
  });
  $('dl-svg').addEventListener('click', () => {
    if (!edit) return;
    const xs = edit.pts.map(p => p[0] / PX_PER_MM);
    const ys = edit.pts.map(p => p[1] / PX_PER_MM);
    const x0 = Math.min(...xs), y0 = Math.min(...ys);
    const w = Math.max(...xs) - x0, h = Math.max(...ys) - y0;
    const d = 'M ' + xs.map((x, i) =>
      `${(x - x0).toFixed(3)},${(ys[i] - y0).toFixed(3)}`).join(' L ') + ' Z';
    downloadBlob(
      `<svg xmlns="http://www.w3.org/2000/svg" width="${w.toFixed(2)}mm" `
      + `height="${h.toFixed(2)}mm" viewBox="0 0 ${w.toFixed(3)} ${h.toFixed(3)}">\n`
      + `  <path d="${d}" fill="none" stroke="black" stroke-width="0.2"/>\n</svg>\n`,
      edit.name + '_outline.svg', 'image/svg+xml');
  });

  // ---------- measurement request ----------
  function row(label, value, unit, cls = '') {
    return `<div class="tb-row ${cls}">
      <span class="label">${label}</span>
      <span class="value">${value}&nbsp;<small>${unit}</small></span>
    </div>`;
  }

  async function measure(file) {
    lastFile = file;
    tbError.hidden = true;
    busy.hidden = false;
    tbFile.textContent = file.name;

    const form = new FormData();
    form.append('photo', file);
    form.append('width', $('opt-width').value);
    form.append('height', $('opt-height').value);
    form.append('convexHull', $('opt-hull').checked);
    form.append('smooth', smoothStrength(parseInt(smoothSlider.value)).toFixed(2));
    form.append('minContrast', String(shadowFloor(parseInt(shadowSlider.value))));

    try {
      const resp = await fetch('/api/measure', { method: 'POST', body: form });
      const data = await resp.json();
      busy.hidden = true;

      if (!data.ok) {
        tbError.textContent = data.error;
        tbError.hidden = false;
        return;
      }

      scaleNote.textContent = 'scale ' + data.mm_per_pixel.toFixed(4) + ' mm/px';
      enterEditor(data, file.name);
    } catch (err) {
      busy.hidden = true;
      tbError.textContent = 'Could not reach the measurement server. '
        + 'Start it from the webapp folder, then try again.';
      tbError.hidden = false;
    }
  }
</script>
</body>
</html>
